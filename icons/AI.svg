<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <g class="layer">
    <title>Layer 1</title>
    <!-- 头部轮廓：圆角方形，代表AI代理/助手界面 -->
    <rect x="6" y="4" width="20" height="20" rx="4" fill="none" stroke="#3399FF" stroke-width="1.8"/>
    <!-- 天线：通信/连接 -->
    <line x1="16" y1="2" x2="16" y2="5" stroke="#3399FF" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="16" cy="2" r="1.5" fill="#3399FF"/>
    <!-- AI星光：四角星形，代表智能/魔力 -->
    <polygon points="16,9 18,13 22,15 18,17 16,21 14,17 10,15 14,13" fill="#FF9933"/>
  </g>
</svg>
