<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <g class="layer">
    <title>Layer 1</title>
    <!-- 蓝色数据曲线 -->
    <path d="M 5 22 C 8 6, 24 20, 27 8"
          fill="none" stroke="#3399FF" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 垂直竖线（数据追踪线） -->
    <line x1="16" y1="5" x2="16" y2="26"
          stroke="#6C7280" stroke-width="1.5" stroke-dasharray="2.5,2.5" stroke-linecap="round"/>
    <!-- 数据点（曲线与竖线交点） -->
    <circle cx="16" cy="14" r="2.2" fill="#6C7280"/>
    <!-- 右下角坐标提示框 -->
    <rect x="21" y="21" width="8" height="7" rx="1.5"
          fill="none" stroke="#6C7280" stroke-width="1.3"/>
    <circle cx="24.5" cy="24.5" r="1" fill="#6C7280"/>
  </g>
</svg>
