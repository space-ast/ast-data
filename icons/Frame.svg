<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <g class="layer">
    <title>Layer 1</title>
    <!-- 负半轴（虚线） -->
    <line x1="16" y1="16" x2="4" y2="16" stroke="#3399FF" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="16" y1="16" x2="26" y2="6" stroke="#3399FF" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- 正半轴 -->
    <line x1="16" y1="16" x2="27" y2="16" stroke="#3399FF" stroke-width="1.5"/>
    <line x1="16" y1="16" x2="16" y2="3" stroke="#3399FF" stroke-width="1.5"/>
    <line x1="16" y1="16" x2="7" y2="25" stroke="#3399FF" stroke-width="1.5"/>
    <!-- 箭头 -->
    <polygon points="-3,-2 3,0 -3,2" fill="#3399FF" transform="translate(27,16) rotate(0)"/>
    <polygon points="-3,-2 3,0 -3,2" fill="#3399FF" transform="translate(16,3) rotate(-90)"/>
    <polygon points="-3,-2 3,0 -3,2" fill="#3399FF" transform="translate(7,25) rotate(135)"/>
    <!-- 原点 -->
    <circle cx="16" cy="16" r="2.2" fill="#FF9933" stroke="#FFFFFF" stroke-width="0.3"/>
  </g>
</svg>
