      <line x1="4" y1="1" x2="10" y2="5" stroke="#3399FF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="9" x2="10" y2="5" stroke="#3399FF" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
