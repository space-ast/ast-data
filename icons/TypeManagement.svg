<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <g class="layer">
    <title>Layer 1</title>
    <!-- 类框外框 -->
    <rect x="5" y="3" width="22" height="26" fill="none" stroke="#3399FF" stroke-width="1.5"/>
    <!-- 上分隔线 -->
    <line x1="5" y1="12" x2="27" y2="12" stroke="#3399FF" stroke-width="1"/>
    <!-- 下分隔线 -->
    <line x1="5" y1="20" x2="27" y2="20" stroke="#3399FF" stroke-width="1"/>
    <!-- 类名占位 -->
    <rect x="9" y="5.5" width="14" height="3.5" fill="#6C7280" rx="0.5"/>
    <!-- 属性条目 -->
    <line x1="8" y1="15" x2="20" y2="15" stroke="#6C7280" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="15" y2="18" stroke="#6C7280" stroke-width="1" stroke-linecap="round"/>
    <!-- 方法条目 -->
    <line x1="8" y1="23" x2="22" y2="23" stroke="#6C7280" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="26" x2="17" y2="26" stroke="#6C7280" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
