<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg">
  <g class="layer">
    <title>Properties</title>
    <!-- 窗口外框 -->
    <rect x="5" y="5" width="22" height="20" rx="1.5"
          fill="none" stroke="#6C7280" stroke-width="1.5"/>
    <!-- 标题栏分割 -->
    <line x1="5" y1="10" x2="27" y2="10" stroke="#6C7280" stroke-width="1"/>
    <!-- 左侧树 -->
    <rect x="7" y="12" width="2" height="2" rx="0.5" fill="#6C7280"/>
    <line x1="10" y1="13" x2="13" y2="13" stroke="#9CA3AF" stroke-width="1" stroke-linecap="round"/>
    <circle cx="8" cy="17" r="1" fill="none" stroke="#6C7280" stroke-width="1.2"/>
    <line x1="10" y1="17" x2="13" y2="17" stroke="#6C7280" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="21" r="1" fill="none" stroke="#6C7280" stroke-width="1.2"/>
    <line x1="10" y1="21" x2="13" y2="21" stroke="#6C7280" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 分割线 -->
    <line x1="15" y1="11" x2="15" y2="24" stroke="#D1D5DB" stroke-width="0.8"/>
    <!-- 右侧属性 -->
    <line x1="17" y1="13" x2="25" y2="13" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="17" y1="17" x2="25" y2="17" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/>
    <line x1="17" y1="21" x2="22" y2="21" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
