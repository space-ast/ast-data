<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <g class="layer">
    <title>Layer 1</title>
    <!-- 散点数据点 -->
    <circle cx="7" cy="20" r="1.4" fill="#3399FF"/>
    <circle cx="12" cy="16" r="1.4" fill="#3399FF"/>
    <circle cx="17" cy="13" r="1.4" fill="#3399FF"/>
    <circle cx="22" cy="9" r="1.4" fill="#3399FF"/>
    <circle cx="27" cy="7" r="1.4" fill="#3399FF"/>
    <!-- 追踪线：从最近点指向坐标提示框左边界 -->
    <line x1="17" y1="13" x2="24" y2="26.5"
          stroke="#6C7280" stroke-width="1.5" stroke-dasharray="2.5,2.5" stroke-linecap="round"/>
    <!-- 最近点高亮（靶心圆） -->
    <circle cx="17" cy="13" r="4" fill="none" stroke="#FF9933" stroke-width="1.3"/>
    <circle cx="17" cy="13" r="2.2" fill="#FF9933"/>
    <!-- 右下角坐标提示框 -->
    <rect x="24" y="23" width="7" height="7" rx="1.5"
          fill="none" stroke="#6C7280" stroke-width="1.3"/>
    <circle cx="27.5" cy="26.5" r="1" fill="#6C7280"/>
  </g>
</svg>
