    <line x1="5" y1="20" x2="15" y2="20" stroke="#6C7280" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 移动体（抽象几何体） -->
    <rect x="17" y="7" width="10" height="18" rx="3" fill="none" stroke="#6C7280" stroke-width="2"/>
  </g>
</svg>
