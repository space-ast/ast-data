    <line x1="16" y1="16" x2="5" y2="16" stroke="#5A8BAC" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="16" y1="16" x2="27" y2="16" stroke="#5A8BAC" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- 点标记 -->
