<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <g class="layer">
    <title>Layer 1</title>
    <!-- 左侧立方体（灰色） — 顶面 -->
    <polygon points="10,7 17,12 10,17 3,12"
             fill="#6C7280" fill-opacity="0.25" stroke="#6C7280" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 左侧立方体 — 左面 -->
    <polygon points="3,12 10,17 10,25 3,20"
             fill="none" stroke="#6C7280" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 左侧立方体 — 右面 -->
    <polygon points="10,17 17,12 17,20 10,25"
             fill="none" stroke="#6C7280" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 右侧立方体（蓝色） — 顶面 -->
    <polygon points="22,7 29,12 22,17 15,12"
             fill="#3399FF" fill-opacity="0.25" stroke="#3399FF" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 右侧立方体 — 左面 -->
    <polygon points="15,12 22,17 22,25 15,20"
             fill="none" stroke="#3399FF" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 右侧立方体 — 右面 -->
    <polygon points="22,17 29,12 29,20 22,25"
             fill="none" stroke="#3399FF" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
